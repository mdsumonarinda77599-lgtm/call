<!-- ========================================== -->
<!--       FLOATING CALL WIDGET HTML            -->
<!-- ========================================== -->
<div class="floating-widget-container">
    
    <!-- Popup Box (Initially Hidden) -->
    <div id="callPopup" class="call-popup-box">
        <button class="close-btn" onclick="togglePopup()">&times;</button>
        <div class="popup-header">
            <img src="https://i.ibb.co/3s3v38z/support-agent.png" alt="Support" class="support-icon">
            <h4>ক্যারিয়ার কাউন্সিলের সাথে কথা বলুন</h4>
        </div>
        <div class="popup-actions">
            <!-- WhatsApp Link with your number -->
            <a href="https://wa.me/8801775990560" target="_blank" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WHATSAPP
            </a>
            <!-- Direct Call Link with your number -->
            <a href="tel:01775990560" class="call-direct-btn">
                <i class="fas fa-phone"></i> CALL
            </a>
        </div>
    </div>

    <!-- Main Floating Trigger Button -->
    <button class="floating-trigger-btn" onclick="togglePopup()">
        <i class="fas fa-headset"></i> কল করুন
    </button>

</div>

<!-- FontAwesome Icons সিডিএন -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<!-- ========================================== -->
<!--             STYLESHEET (CSS)               -->
<!-- ========================================== -->
<style>
.floating-widget-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.floating-trigger-btn {
    background: linear-gradient(135deg, #f39c12, #2980b9);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.3s ease;
}

.floating-trigger-btn:hover {
    transform: scale(1.05);
}

.call-popup-box {
    display: none; 
    position: absolute;
    bottom: 65px;
    right: 0;
    width: 280px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    padding: 20px;
    text-align: center;
    animation: fadeIn 0.3s ease-in-out;
}

.close-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: none;
    font-size: 18px;
    color: #aaa;
    cursor: pointer;
}

.close-btn:hover {
    color: #000;
}

.support-icon {
    width: 60px;
    margin-bottom: 10px;
}

.call-popup-box h4 {
    font-size: 15px;
    color: #333;
    margin-bottom: 15px;
}

.popup-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.whatsapp-btn, .call-direct-btn {
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.whatsapp-btn {
    background-color: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
}

.call-direct-btn {
    background-color: #ffc107;
    color: #000;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .floating-widget-container {
        bottom: 15px;
        right: 15px;
    }
    .call-popup-box {
        width: 250px;
    }
}
</style>


<!-- ========================================== -->
<!--             JAVASCRIPT                     -->
<!-- ========================================== -->
<script>
function togglePopup() {
    const popup = document.getElementById('callPopup');
    if (popup.style.display === 'block') {
        popup.style.display = 'none';
    } else {
        popup.style.display = 'block';
    }
}
</script>
